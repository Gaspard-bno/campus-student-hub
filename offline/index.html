/* assets/css/base.css */
@layer base {

  button { cursor: pointer; background: none; border: 0; padding: 0; margin: 0; }

  .view--help { display: flex; flex-direction: column; gap: var(--s-6); }
  .view--help .hp-urgent {
    background: var(--ink-900); border: 1px solid var(--danger); border-radius: var(--r-md);
    padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-3);
  }
  .view--help .hp-urgent p, .view--help .hp-h2, .view--help .hp-h3 { margin: 0; overflow-wrap: anywhere; }
  .view--help .hp-h2 { font-size: var(--fs-20); color: var(--text-1); }
  .view--help .hp-urgent .hp-h2 { color: var(--danger); }
  .view--help .hp-h3 { font-size: var(--fs-16); color: var(--danger); margin-top: var(--s-2); }
  .view--help .hp-call {
    min-height: 52px; height: auto; display: inline-flex; align-items: center; justify-content: center;
    gap: var(--s-2); text-decoration: none; text-align: center; white-space: normal;
  }
  .view--help .hp-note { color: var(--text-2); font-size: var(--fs-14); }
  .view--help .hp-chat { display: flex; flex-direction: column; gap: var(--s-3); }
  .view--help .chat-log {
    display: flex; flex-direction: column; gap: var(--s-2); max-height: 320px; overflow-y: auto;
    padding: var(--s-2) 0;
  }
  .view--help .chat-msg {
    margin: 0; padding: var(--s-3); border-radius: var(--r-md); max-width: 88%;
    font-size: var(--fs-14); overflow-wrap: anywhere;
  }
  .view--help .chat-msg[data-from="team"] { background: var(--ink-800); color: var(--text-1); align-self: flex-start; }
  .view--help .chat-msg[data-from="me"] { background: var(--ember-500); color: var(--on-ember, var(--ink-950)); align-self: flex-end; }
  .view--help .chat-dots { display: inline-flex; gap: var(--s-1); align-items: center; height: 1em; }
  .view--help .chat-dots i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-2);
    animation: chat-blink 1s var(--ease-out) infinite;
  }
  .view--help .chat-dots i:nth-child(2) { animation-delay: 0.15s; }
  .view--help .chat-dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes chat-blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  .view--help .chat-chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .view--help .chat-chip {
    min-height: 44px; height: auto; white-space: normal; text-align: left; cursor: pointer;
    transition: transform var(--t-press) var(--ease-out), background-color var(--t-press) var(--ease-out);
  }
  .view--help .chat-chip:active, .view--help .btn:active { transform: scale(0.97); }
  .view--help .chat-form { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: stretch; }
  .view--help .chat-field { flex: 1 1 160px; min-width: 0; }
  .view--help .chat-input { width: 100%; min-height: 44px; font: inherit; color: var(--text-1); background: transparent; border: 0; outline-offset: 2px; }
  .view--help .chat-send { min-height: 48px; height: auto; display: inline-flex; gap: var(--s-2); align-items: center; justify-content: center; flex: 0 0 auto; }
  @media (prefers-reduced-motion: reduce) {
    .view--help .chat-dots i { animation: none; opacity: 0.7; }
    .view--help .chat-chip { transition: none; }
    .view--help .chat-chip:active, .view--help .btn:active { transform: none; }
  }
}

/* assets/css/view-observer.css */
@layer views {
  .obs { display: flex; flex-direction: column; gap: var(--s-3); }
  .obs-title { margin: 0; color: var(--text-2); }
  .obs-timer { margin: 0; font-family: var(--font-mono); font-size: var(--fs-25); color: var(--text-1); }
  .obs-btns { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .obs-btn { min-height: 44px; }
  .obs-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .obs-result { margin: 0; min-height: 1.5em; color: var(--success); font-family: var(--font-mono); font-size: var(--fs-14); overflow-wrap: anywhere; }
}

#phone {
  --ink-950: #FAF8FD;
  --ink-900: #FEFEFF;
  --ink-800: #EFE8F7;

  --text-1: #1D1429;
  --text-2: #463A55;
  --text-3: #655A75;
  --ember-500: #5A2A86;
  --ember-400: #6D3A9C;
  --amber-300: #5A2A86;
  --rose-300: #B79AD6;
  --violet-400: #5A2A86;
  --cream-50: #F3EEFA;
  --on-ember: #FEFEFF;
  --on-cream: #1D1429;
  --on-cream-2: #463A55;
  --danger: #BE2637;
  --success: #1B8048;
  --focus: #5A2A86;

  --field-line: #857399; 
  --shadow-card: 0 1px 2px rgba(45, 20, 75, 0.08), 0 4px 12px rgba(45, 20, 75, 0.06);

  background: var(--ink-950);
  color: var(--text-1);

#phone .banner { background: var(--ink-800); color: var(--ember-500); border-color: var(--line); }
#phone .app-header {
  --text-1: #FEFEFF;
  --text-2: #E9DFF5;
  --ink-900: rgba(255, 255, 255, 0.14);
  --ink-800: rgba(255, 255, 255, 0.24);
  --line: rgba(255, 255, 255, 0.55);
  --focus: #FEFEFF;
  --danger: #BE2637;
  --danger-tint: #FEFEFF;
  background: #5A2A86;
  color: #FEFEFF;
  border: 0;
}
#phone .app-header :focus-visible { outline-color: #FEFEFF; }
#phone .lang__menu {

  background: #5A2A86; color: #FEFEFF;
  margin: calc(var(--s-4) * -1) calc(var(--s-4) * -1) 0;
  padding: var(--s-2) var(--s-4) var(--s-6);
}
#phone .back-bar { padding: 0 var(--s-2) var(--s-2); }
#phone .back-bar :focus-visible, #phone .home__head .view__title:focus-visible { outline-color: #FEFEFF; }
#phone .back-btn { color: #FEFEFF; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; font-size: var(--fs-14); }
#phone .home__title { font-size: var(--fs-25); }
#phone .searchbar { background: #FEFEFF; border-color: var(--field-line); border-radius: 10px; box-shadow: var(--shadow-card); }
#phone .searchbar__input { font-family: var(--font-sans); font-size: var(--fs-16); }
#phone .searchbar__input::placeholder { font-family: var(--font-sans); }
#phone .chat-field { border-color: var(--field-line); }
#phone .card, #phone .cat, #phone .next, #phone .svc-advisor, #phone .list-row { box-shadow: var(--shadow-card); }
#phone .cat__icon, #phone .svc-fact__icon, #phone .next__icon { color: var(--ember-500); }
#phone .card--cream { background: #FEFEFF; border: 1px solid var(--line); }
#phone .label-mono { font-family: var(--font-sans); font-weight: 700; letter-spacing: 0.04em; color: var(--text-1); }
#phone .view__title { text-transform: none; }
#phone .cats--v2 .cat:not(.cat--featured) { flex-direction: column; gap: var(--s-2); padding: var(--s-3); }
#phone .cats--v2 .cat:not(.cat--featured) .cat__icon { margin-top: 0; }
#phone .cat__label, #phone .cat__hint { overflow-wrap: break-word; }
html[data-version="1"] #phone .cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
html[data-version="1"] #phone .cat { flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; gap: var(--s-2); padding: var(--s-3) var(--s-1); min-height: 96px; }
html[data-version="1"] #phone .cat__text { align-items: center; }
html[data-version="1"] #phone .cat__label { font-size: var(--fs-12); font-weight: 600; line-height: 1.2; }
html[data-version="1"] #phone .cat__hint { display: none; }
#phone .btn { border-radius: 10px; }
#phone .btn--primary { text-transform: uppercase; letter-spacing: 0.04em; font-size: var(--fs-14); font-weight: 700; }
#phone .btn--secondary { background: #FEFEFF; color: var(--ember-500); border: 1.5px solid var(--ember-500); }
@media (hover: hover) { #phone .btn--secondary:hover:not(:disabled) { background: var(--ink-800); } }
#phone .btn--ghost { color: var(--ember-500); }
#phone .btn--danger { color: #FEFEFF; }
#phone .book-slot, #phone .book-day { background: #FEFEFF; border: 1.5px solid var(--ember-500); color: var(--ember-500); border-radius: 8px; font-family: var(--font-sans); font-weight: 600; }
#phone .book-day__wd { font-family: var(--font-sans); }
#phone .book-slot[aria-pressed="true"], #phone .book-day[aria-pressed="true"] { background: var(--ember-500); color: #FEFEFF; }

#phone .seg { border-color: var(--field-line); }
#phone .seg__opt[aria-pressed="true"] { background: var(--ember-500); color: #FEFEFF; }
#phone .cf-ref { background: var(--ink-800); border: 0; border-radius: 10px; }
#phone .cf-ref__code { color: var(--ember-500); font-family: var(--font-sans); font-weight: 700; }
#phone .view--confirm .view__title { text-transform: uppercase; letter-spacing: 0.01em; }
#phone .tabbar { background: #FEFEFF; border-color: var(--line); }
#phone .tab[aria-current="page"] { color: var(--ember-500); }
#phone .next { background: #FEFEFF; border: 1px solid var(--line); color: var(--text-1); }
#phone .next__name, #phone .next__label, #phone .next__chev { color: var(--text-1); }

#phone .chip { background: var(--ink-800); border-color: var(--line); color: var(--text-1); }
#phone .avatar { background: var(--ember-500); color: #FEFEFF; }

</style>
